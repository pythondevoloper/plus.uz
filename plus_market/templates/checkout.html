<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyurtmani rasmiylashtirish - {{ product.title }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .checkout-container {
            background: #ffffff;
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }
        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }
        .product-summary {
            background-color: #f8f9fa;
            padding: 30px;
            border-right: 1px solid #eee;
        }
        .product-summary h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #222;
        }
        .product-card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            margin-bottom: 20px;
        }
        .product-card h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .product-card .price {
            font-size: 20px;
            font-weight: bold;
            color: #2b6cb0;
        }
        .product-card .stock-info {
            font-size: 13px;
            color: #718096;
            margin-top: 5px;
        }
        .checkout-form {
            padding: 30px;
        }
        .checkout-form h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #222;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4a5568;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #3182ce;
        }
        .messages {
            margin-bottom: 15px;
        }
        .alert {
            padding: 10px;
            background-color: #fed7d7;
            color: #9b2c2c;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .submit-btn {
            width: 100%;
            background-color: #3182ce;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #2b6cb0;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #718096;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="checkout-container">
    <!-- Chap tomon: Mahsulot haqida ma'lumot -->
    <div class="product-summary">
        <h2>Mahsulot ma'lumoti</h2>
        <div class="product-card">
            <h3>{{ product.title }}</h3>
            <div class="price">{{ product.price }} so'm</div>
            <div class="stock-info">Mavjud: {{ product.stock }} {{ product.unit|default:"dona" }}</div>
        </div>
    </div>

    <!-- O'ng tomon: Buyurtma formasi -->
    <div class="checkout-form">
        <h2>Buyurtmani tasdiqlash</h2>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form action="{% url 'checkout' product.id %}" method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="full_name">F.I.O. (Ism va Familiya):</label>
                <input type="text" id="full_name" name="full_name" placeholder="Masalan: Ali Valiyev" required>
            </div>

            <div class="form-group">
                <label for="phone_number">Telefon raqam:</label>
                <input type="text" id="phone_number" name="phone_number" placeholder="+998 90 123 45 67" required>
            </div>

            <div class="form-group">
                <label for="region">Viloyat / Hudud:</label>
                <select id="region" name="region" required>
                    <option value="" disabled selected>Viloyatni tanlang</option>
                    {% for region in regions %}
                        <option value="{{ region.id }}">{{ region.name }} (Yetkazib berish: {{ region.delivery_cost }} so'm)</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="address">Aniq manzil (Tuman, ko'cha, uy):</label>
                <input type="text" id="address" name="address" placeholder="Toshkent sh., Chilonzor tumani..." required>
            </div>

            <div class="form-group">
                <label for="quantity">Soni:</label>
                <input type="number" id="quantity" name="quantity" value="1" min="1" max="{{ product.stock }}" required>
            </div>

            <button type="submit" class="submit-btn">Buyurtma berish</button>
            <a href="javascript:history.back()" class="back-link">← Orqaga qaytish</a>
        </form>
    </div>
</div>

</body>
</html>
