<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plus Market | Admin Tizimiga Kirish</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800/80 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">
                Plus Market
            </h1>
            <p class="text-slate-400 text-sm mt-2">Boshqaruv paneliga kirish</p>
        </div>

        {% if form.errors %}
            <div class="bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-xl mb-6 text-sm text-center">
                Loginingiz yoki parolingiz xato!
            </div>
        {% endif %}

        <form method="post" action="{{ app_path }}" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2">Username</label>
                <input type="text" name="username" required
                    class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
                    placeholder="Foydalanuvchi nomi">
            </div>

            <div>
                <label class="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2">Parol</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
                    placeholder="••••••••">
            </div>

            <button type="submit" 
                class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all duration-200">
                Tizimga Kirish
            </button>
        </form>
    </div>
</body>
</html>
